name: Post-Release Tasks

on:
  release:
    types: [published]

jobs:
  tag-and-push-docker-image:
    name: Build and Push Release Docker Image
    runs-on: ubuntu-latest
    # Requires the repository variable DOCKERHUB_NAMESPACE and the
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets.
    if: vars.DOCKERHUB_NAMESPACE != ''
    env:
      IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Release Image
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
          SHORT_SHA=$(git rev-parse --short=10 HEAD)
          make dist APP_VERSION="$CLEAN_VERSION" GIT_SHA="$SHORT_SHA"
          docker tag coneshare:latest "${IMAGE_NAMESPACE}/coneshare:${CLEAN_VERSION}"
          docker push "${IMAGE_NAMESPACE}/coneshare:${CLEAN_VERSION}"
