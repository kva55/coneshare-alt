<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #111827; line-height: 1.5;">
  <p>Hello,</p>
  <p>Someone asked for access to <strong>{{ target_name }}</strong>.</p>
  <p>Your one-time access code is:</p>
  <p style="font-size: 28px; letter-spacing: 4px; font-weight: 700; font-family: Menlo, Consolas, monospace; background: #f3f4f6; display: inline-block; padding: 12px 20px; border-radius: 8px;">{{ code }}</p>
  <p>Enter it at <a href="{{ view_url }}">{{ view_url }}</a></p>
  <p style="color: #6b7280; font-size: 13px;">The code works once and expires in {{ ttl_minutes }} minutes. If you did not ask for access, ignore this email: nobody can open the document without this code.</p>
</body>
</html>
