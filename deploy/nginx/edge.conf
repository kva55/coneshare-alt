# HTTPS front door for the dev stack. Browsers talk TLS to this; it forwards to the frontend container.
# (The dev servers behind it speak plain HTTP on the private compose network; see docs/fork/container-security.md.)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# What is logged: the path without its query string, and signed file links without their token, so an identifier
# in an address does not end up in a log (see docs/fork/caching-and-urls.md).
map $uri $logged_uri {
    ~^/files/(?<kind>download|preview)/ "/files/$kind/[token]";
    default $uri;
}
log_format edge '$remote_addr [$time_local] "$request_method $logged_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8443 ssl;
    access_log /var/log/nginx/access.log edge;
    http2 on;
    server_name _;

    ssl_certificate     /certs/edge.crt;
    ssl_certificate_key /certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    client_max_body_size 600m;

    include /etc/nginx/snippets/security-headers.conf;

    # API answers and file downloads are never stored by a browser or a proxy, whatever the upstream said.
    location ~ ^/(api|api-auth|files)/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, private, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # replace, never append: clients cannot forge it
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;           # Vite hot reload
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
