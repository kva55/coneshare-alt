x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "3"

services:
  core:
    <<: *default-logging
    build:
      context: ./core
      dockerfile: Dockerfile-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./core:/app
      - ~/.coneshare-data:/storage

  backend:
    <<: *default-logging
    image: coneshare:dev
    build:
      context: ./backend
      dockerfile: Dockerfile-dev
    command: python manage.py runserver 0.0.0.0:8000
    # command: tail -f /dev/null
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis
      - core
    env_file: .env

  redis:
    <<: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data

  celery_worker:
    <<: *default-logging
    image: coneshare:dev
    command: celery -A backend worker -l INFO -Q celery --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      - backend
      - redis
      - core
    env_file: .env

  celery_beat:
    <<: *default-logging
    image: coneshare:dev
    command: celery -A backend beat -l INFO
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    env_file: .env

  frontend:
    <<: *default-logging
    image: coneshare:frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis_data:
